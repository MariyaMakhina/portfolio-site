{% load wagtailcore_tags %}

<div class="navigation-buttons">
    {% if show_home_button %}
        <a href="/" class="nav-btn nav-btn--home">
            <span class="nav-btn__icon">&lang;&lang;</span>
            <span class="nav-btn__text">На главную</span>
        </a>
    {% endif %}
    
    {% if show_blog_button %}
        <a href="{{ blog_page_url }}" class="nav-btn nav-btn--blog">
            <span class="nav-btn__icon">&lang;</span>
            <span class="nav-btn__text">Ко всем статьям</span>
        </a>
    {% endif %}
    
    {% if show_back_button %}
        <a href="javascript:history.back()" class="nav-btn nav-btn--back">
            <span class="nav-btn__icon">&lang;</span>
            <span class="nav-btn__text">Назад</span>
        </a>
    {% endif %}
    <!-- Кнопка на страницу проектов (только для администратора) -->
    {% if show_projects_button and request.user.is_authenticated and request.user.is_superuser %}
        <a href="/projects/" class="nav-btn nav-btn--projects">
            <span class="nav-btn__icon">&lang;</span>
            <span class="nav-btn__text">Проекты</span>
        </a>
    {% endif %}
</div>
