{% load wagtailcore_tags wagtailimages_tags %}

<div class="boxs project-card">

    {# Проверяем наличие ссылки на страницу сайта или внешней ссылки #}
    {% if self.link_page %}
        <a href="{{ self.link_page.url }}" class="link-block">
    {% elif self.external_link %}
        <a href="{{ self.external_link }}" class="link-block" target="_blank" rel="noopener noreferrer">
    {% endif %}
    
        <div class="box">
            <div class="imag-proj">
                {% image self.image fill-350x250 as project_img %}
                <img src="{{ project_img.url }}" alt="{{ self.title }}">
            </div>
            <div class="description">
                <h3>{{ self.title }}</h3>
                <div class="project-description">{{ self.description|richtext }}</div>
            </div>
        </div>
    </a>
</div>
